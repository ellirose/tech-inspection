# Nginx site for Tech-Inspection, written by `ti domain` from deploy/nginx.conf (__HOST__ is the site's
# name). certbot adds the HTTPS server to this file. Local edits are lost on the next `ti domain`.
upstream tech_inspection {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    # Until the real domain points here, keep search engines away (`ti index on|off`).
    add_header X-Robots-Tag "noindex, nofollow" always; # ti-noindex
    # Media uploads (20 MB PDFs) and quote attachments (10 MB) with room for the form.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The app rate-limits and logs by X-Real-IP (README, Admin panel).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Chat answers stream line by line; buffering would hold them back.
    location = /api/chat {
        proxy_pass http://tech_inspection;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Media library uploads: videos up to 100 MB.
    location = /api/admin/media {
        client_max_body_size 110m;
        proxy_pass http://tech_inspection;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://tech_inspection;
        proxy_read_timeout 60s;
    }
}

# Requests by IP address or any other name go to the site's name.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 __SCHEME__://__HOST__$request_uri;
}
